<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lineup.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  
    <title>line-up</title>
</head>
<body>
<header>
        
     <nav id="navbar">
    <div class="nav-inner">
      <a href="#" class="nav-logo">FSL<span>.</span></a>

      <div class="nav-links">
        <a href="index.html">Acceuil</a>
        <a href="lineup.html">line-up</a>
        <a href="billetterie.html">Billetterie</a>
        <a href="" class="nav-cta">Réserver</a>
      </div>

      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html">Accueil</a>
      <a href="lineup.html">line-up</a>
      <a href="billetterie.html">billetterie</a>
     
            
        
    </header>


    <main>
    <section id="artistes">
  <div class="artist-inner">
    <p class="artist-eyebrow">Programmation</p>
    <h2 class="artist-title">Artistes & Créateurs</h2>

    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">Tous</button>
      <button class="filter-btn" data-filter="musique">Musique</button>
      <button class="filter-btn" data-filter="mode">Mode & Sape</button>
      <button class="filter-btn" data-filter="lumiere">Art Lumière</button>
      <button class="filter-btn" data-filter="lumiere">Influenceur</button>
    </div>

    <div class="artist-grid" id="artist-grid"></div>
  </div>
</section>
    </main>
    <footer class="footer">
        <p> &copy; 2026 Festival Sape & Lumière — Line-Up Officiel.</p>
    </footer>
    <script>
    
  const CATEGORY_STYLES = {
    'musique': { name: 'Musique', bg: 'rgba(224, 64, 176, 0.2)', text: '#e040b0' },
    'mode':    { name: 'Mode & Sape', bg: 'rgba(232, 184, 75, 0.2)', text: '#e8b84b' },
    'lumiere': { name: 'Art Lumière', bg: 'rgba(106, 212, 255, 0.2)', text: '#6ad4ff' },
    'influenceur': { name: 'influenceur', bg: 'rgba(106, 212, 255, 0.2)', text: '#6ad4ff' }
  };

  const ARTISTS = [
    {
      name: "Koffi Brazza",
      category: "musique",
      discipline: "Rumba Congolaise moderne",
      bio: "Pionnier du renouveau de la rumba, Koffi fusionne rythmes traditionnels et sonorités urbaines.",
      image: "koffi de brazza.jfif"
    },
    {
      name: "Yves Saint-Brazza",
      category: "mode",
      discipline: "Maître Sapeur & Designer",
      bio: "Figure emblématique de Bacongo, célèbre pour ses associations de couleurs audacieuses et ses coupes sur mesure.",
      image: "iyves saint de brazza.jfif"
    },
    {
      name: "Mireille Essomba",
      category: "lumiere",
      discipline: "Artiste plasticienne lumière",
      bio: "Sculptrice de lumière créant des installations immersives géantes inspirées des motifs textiles africains.",
      image: "istockphoto-1268391609-1024x1024.jpg"
    },
    {
      name: "Imara Soul",
      category: "musique",
      discipline: "Afro-Jazz & Soul",
      bio: "Une voix envoûtante portée par des mélodies cuivrées et un groove urbain d'une intensité rare.",
      image: "imara.jfif"
    },
    {
      name: "Maison Mwana",
      category: "mode",
      discipline: "Haute Couture Africaine",
      bio: "Maison de couture réinventant les codes du costume trois-pièces avec des tissus pagne structurés.",
      image: "maison mwana.jfif"
    },
    {
      name: "Neon Savane Studio",
      category: "lumiere",
      discipline: "Mapping vidéo & Néons",
      bio: "Collectif de créateurs visuels spécialisés dans la projection monumentale sur façades urbaines.",
      image: "neon savane.jfif"
    },
    {
      name: "Warano the king",
      category: "influenceur",
      discipline: "Creation de contenu/Entertaiment",
      bio: "Influenceur et createur de contenu de congolaise connu Pour ses publications et vidéos de divertissement",
      image: "warano.jfif"
    },
    {
      name: "money love",
      category: "influenceur",
      discipline: "Beauté/Coiffure",
      bio: "créatrice de contenu spécialisée das la beauté et lla coiffure, avec une forte présence sur tiktok",
      image: "money love.jfif"
    },
    {
      name: "lecaleb2",
      category: "influenceur",
      discipline: "Humour/Lifestyle",
      bio: "Influenceur congolais présent sur les sociaux, notament tiktok, avec des contenus axés sur le divertissement",
      image: "lecaleb2.jfif"
    }
  ];

  function renderArtists(filter = 'all') {
    const grid = document.getElementById('artist-grid');
    const filtered = filter === 'all' 
      ? ARTISTS 
      : ARTISTS.filter(a => a.category === filter);

    grid.innerHTML = filtered.map(artist => {
      const style = CATEGORY_STYLES[artist.category];
      return `
        <div class="artist-card">
          <div class="artist-img-wrapper">
            <img src="${artist.image}" alt="${artist.name}" class="artist-img" loading="lazy" />
            <span class="artist-badge" style="background: ${style.bg}; color: ${style.text}">
              ${style.name}
            </span>
          </div>
          <div class="artist-info">
            <h3 class="artist-name">${artist.name}</h3>
            <p class="artist-discipline">${artist.discipline}</p>
            <p class="artist-bio">${artist.bio}</p>
          </div>
        </div>
      `;
    }).join('');
  }

  // Filtrage par boutons
  document.querySelectorAll('.filter-btn').forEach(button => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      renderArtists(button.dataset.filter);
    });
  });

  // Rendu initial
  renderArtists();
    </script>
    <script src="app.js"></script>
</body>
</html>
